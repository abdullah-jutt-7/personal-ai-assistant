        .logo-carousel-container {

        .logo-carousel {
            display: flex;

            animation: scroll 40s linear infinite;
        }
        .logo-slide {
            flex: 0 0 auto;

        }
        .logo-slide img {
            max-height: 100px; /* Adjust the height to align logos */
            max-width: 220px;  /* Add a maximum width to prevent logos from being too large */
            display: block;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
